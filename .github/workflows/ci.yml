name: ci

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        run: |
          pnpm install --frozen-lockfile

      - name: Start Docker
        run: pnpm run docker:start

      - name: Build TS
        run: |
          pnpm run build

      - name: Run Tests
        run: |
          pnpm run test:ci

      - name: Stop Docker
        run: pnpm run docker:stop

  changeset-check:
    # Skip for PRs labelled `skip-release` (Dependabot applies this label to every
    # PR it opens), and for the changesets "Release Packages" PR, which intentionally
    # bumps the version and removes the changeset files it consumes. A skipped job is
    # reported as a successful required check.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-release') && !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    name: Changes are covered by a changeset
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changeset status diffs against the base branch, so full history is required
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails when the package changed since the base branch and no changeset covers it.
      # Use an empty changeset (`pnpm changeset --empty`) for changes that must not bump the version.
      - name: Check changesets
        run: pnpm changeset status --since=origin/main

  automerge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
